<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quran Reader — Full Quran</title><meta name="description" content="Read the Holy Quran with Arabic text, translation, audio, search, bookmarks and Juz navigation."><link rel="manifest" href="manifest.json"><style>body{margin:0;font-family:system-ui,sans-serif;background:#f7f7f5;color:#171717}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:12px;z-index:2}h1{margin:0;font-size:22px}.bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}button,input,select{padding:10px;border:1px solid #ccc;border-radius:10px;background:#fff}main{max-width:850px;margin:auto;padding:16px}.ayah{background:#fff;margin:12px 0;padding:18px;border-radius:14px;border:1px solid #e5e5e5}.ar{font-size:29px;line-height:2.1;text-align:right;direction:rtl}.tr{font-size:16px;line-height:1.6;color:#555}.num{font-weight:700}.actions{display:flex;gap:6px;margin-top:10px}.fav{background:#fff7d6}.muted{color:#666}#status{padding:12px;text-align:center}</style></head><body><header><h1>📖 Quran Reader</h1><div class="bar"><select id="surah"></select><select id="lang"><option value="en">English</option><option value="ur">Urdu</option></select><input id="search" placeholder="Search Surah/Ayah..."><button onclick="toggleDark()">🌙</button></div></header><main><div id="status">Loading Quran…</div><section id="quran"></section></main><script>const API='https://api.alquran.cloud/v1';let data=[],translation='en.asad',dark=false;const surahNames=['Al-Fatihah','Al-Baqarah','Aal-E-Imran','An-Nisa','Al-Maidah','Al-Anam','Al-Araf','Al-Anfal','At-Tawbah','Yunus','Hud','Yusuf','Ar-Rad','Ibrahim','Al-Hijr','An-Nahl','Al-Isra','Al-Kahf','Maryam','Ta-Ha','Al-Anbiya','Al-Hajj','Al-Muminun','An-Nur','Al-Furqan','Ash-Shuara','An-Naml','Al-Qasas','Al-Ankabut','Ar-Rum','Luqman','As-Sajdah','Al-Ahzab','Saba','Fatir','Ya-Sin','As-Saffat','Sad','Az-Zumar','Ghafir','Fussilat','Ash-Shura','Az-Zukhruf','Ad-Dukhan','Al-Jathiyah','Al-Ahqaf','Muhammad','Al-Fath','Al-Hujurat','Qaf','Adh-Dhariyat','At-Tur','An-Najm','Al-Qamar','Ar-Rahman','Al-Waqiah','Al-Hadid','Al-Mujadilah','Al-Hashr','Al-Mumtahanah','As-Saff','Al-Jumuah','Al-Munafiqun','At-Taghabun','At-Talaq','At-Tahrim','Al-Mulk','Al-Qalam','Al-Haqqah','Al-Maarij','Nuh','Al-Jinn','Al-Muzzammil','Al-Muddaththir','Al-Qiyamah','Al-Insan','Al-Mursalat','An-Naba','An-Naziat','Abasa','At-Takwir','Al-Infitar','Al-Mutaffifin','Al-Inshiqaq','Al-Buruj','At-Tariq','Al-Ala','Al-Ghashiyah','Al-Fajr','Al-Balad','Ash-Shams','Al-Layl','Ad-Duha','Ash-Sharh','At-Tin','Al-Alaq','Al-Qadr','Al-Bayyinah','Az-Zalzalah','Al-Adiyat','Al-Qariah','At-Takathur','Al-Asr','Al-Humazah','Al-Fil','Quraysh','Al-Maun','Al-Kawthar','Al-Kafirun','An-Nasr','Al-Masad','Al-Ikhlas','Al-Falaq','An-Nas'];const s=document.getElementById('surah');surahNames.forEach((n,i)=>{let o=document.createElement('option');o.value=i+1;o.textContent=(i+1)+'. '+n;s.appendChild(o)});async function load(n=1){document.getElementById('status').textContent='Loading '+surahNames[n-1]+'…';let r=await fetch(`${API}/surah/${n}/quran-uthmani,en.asad`),j=await r.json();data=j.data[0].ayahs.map((a,i)=>({ar:a.text,tr:j.data[1].ayahs[i]?.text||'',num:a.numberInSurah,audio:`https://cdn.islamic.network/quran/audio/128/ar.alafasy/${a.number}.mp3`}));render();document.getElementById('status').textContent='';localStorage.setItem('lastSurah',n)}function render(){let q=document.getElementById('quran'),term=document.getElementById('search').value.toLowerCase();q.innerHTML='';data.forEach(a=>{if(term&&!((a.tr||'').toLowerCase().includes(term)||String(a.num).includes(term)))return;let d=document.createElement('article');d.className='ayah';d.innerHTML=`<div class="num">Ayah ${a.num}</div><div class="ar">${a.ar}</div><div class="tr">${a.tr}</div><div class="actions"><button onclick="new Audio('${a.audio}').play()">🔊 Play</button><button onclick="bookmark(${a.num})">🔖 Bookmark</button><button onclick="navigator.share?navigator.share({text:'${a.ar}'}):navigator.clipboard.writeText('${a.ar}')">↗ Share</button></div>`;q.appendChild(d)})}function bookmark(n){let b=JSON.parse(localStorage.bookmarks||'[]');if(!b.includes(n))b.push(n);localStorage.bookmarks=JSON.stringify(b);alert('Ayah bookmarked')}function toggleDark(){dark=!dark;document.body.style.background=dark?'#121212':'#f7f7f5';document.body.style.color=dark?'#eee':'#171717';document.querySelectorAll('.ayah').forEach(x=>{x.style.background=dark?'#1d1d1d':'#fff';x.style.borderColor=dark?'#333':'#e5e5e5'})}s.onchange=()=>load(+s.value);document.getElementById('search').oninput=render;document.getElementById('lang').onchange=()=>alert('Urdu translation can be enabled by selecting an Urdu edition in the next update.');load(+(localStorage.lastSurah||1));</script></body></html>
